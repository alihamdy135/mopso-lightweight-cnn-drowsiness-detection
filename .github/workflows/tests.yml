name: tests

on:
  push:
  pull_request:

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m compileall -q src scripts tests
      - run: pytest -q
        env:
          PYTHONPATH: src
